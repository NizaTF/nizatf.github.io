<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secreto Desbloqueado · Nico Talens</title>
  <link rel="icon" type="image/png" href="assets/img/favicon_oscuro.png">
  <meta name="robots" content="noindex, nofollow">
  
  <style>
    :root {
      --bg: #0a0e17;
      --surface: #0f1522;
      --border: #1e2938;
      --accent: #ff4d5e;
      --green: #3ddc97;
      --text: #e8ecf1;
      --text-muted: #8b95a5;
      --font-mono: 'Courier New', Courier, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle, rgba(255, 77, 94, 0.10) 3.2px, transparent 1.4px);
      background-size: 100px 100px;
      background-position: 0 0;
      color: var(--text);
      font-family: var(--font-sans);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .secret-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 50px 40px;
      text-align: center;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(255, 77, 94, 0.05);
      animation: popIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .secret-icon {
      font-size: 60px;
      margin-bottom: 20px;
      display: inline-block;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .secret-title {
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 24px;
      margin: 0 0 15px 0;
      letter-spacing: -0.5px;
    }

    .secret-desc {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .secret-desc strong { color: var(--text); }

    .claim-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 600;
      font-family: var(--font-sans);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(255, 77, 94, 0.3);
      width: 100%;
    }

    .claim-btn:hover {
      background: #e63946;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 77, 94, 0.5);
    }

    /* ============================
       EL RICKROLL (Con vídeo local)
       ============================ */
    .rickroll-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
      animation: flashIn 0.2s ease-out;
    }

    @keyframes flashIn {
      0% { opacity: 0; filter: brightness(3); }
      100% { opacity: 1; filter: brightness(1); }
    }

    .rickroll-title {
      font-family: var(--font-mono);
      color: var(--accent);
      font-size: 32px;
      margin-bottom: 20px;
      text-shadow: 0 0 20px rgba(255, 77, 94, 0.6);
    }

    .rickroll-subtitle {
      font-family: var(--font-mono);
      color: var(--green);
      font-size: 16px;
      margin-bottom: 30px;
    }

    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 50px rgba(255, 77, 94, 0.3);
      border: 2px solid var(--border);
      background: #000;
    }

    /* Estilo para la etiqueta <video> nativa */
    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    
    .back-btn {
      margin-top: 30px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 10px 20px;
      border-radius: 6px;
      font-family: var(--font-mono);
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    
    .back-btn:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- 1. CONTENEDOR DEL PREMIO -->
  <div class="secret-container" id="prize-container">
    <div class="secret-icon">🏆</div>
    <h1 class="secret-title">¡Logro Desbloqueado!</h1>
    <p class="secret-desc">
      Has encontrado la página secreta.<br>
      Eres oficialmente más observador que el <strong>99% de los visitantes</strong>.<br><br>
      Como recompensa, tienes acceso a un premio exclusivo.
    </p>
    <button class="claim-btn" id="claim-btn" onclick="claimPrize()">
      🎁 Reclamar mi premio
    </button>
  </div>

  <!-- 2. CONTENEDOR DEL RICKROLL -->
  <div class="rickroll-container" id="rickroll-container">
    <h1 class="rickroll-title">>_ HAS SIDO RICKROLLEADO</h1>
    <p class="rickroll-subtitle">Este es el secreto que tanto buscabas...</p>
    
    <div class="video-wrapper">
      <!-- Usamos la etiqueta <video> con el archivo local -->
      <video id="rickroll-video" controls playsinline>
        <source src="assets/video/Original mp4.xawL3WXj.mp4.part" type="video/mp4">
        Tu navegador no soporta la etiqueta de vídeo.
      </video>
    </div>

    <a href="index.html" class="back-btn">← Volver al portfolio (sin dignidad)</a>
  </div>

  <script>
    function claimPrize() {
      // Ocultamos la tarjeta del premio
      document.getElementById('prize-container').style.display = 'none';
      
      // Mostramos el contenedor del vídeo
      const rickrollContainer = document.getElementById('rickroll-container');
      rickrollContainer.style.display = 'flex';
      
      // Reproducimos el vídeo local automáticamente
      const video = document.getElementById('rickroll-video');
      video.play().catch(error => {
        console.log("El navegador bloqueó el autoplay, pero el usuario puede darle al play.");
      });
    }
  </script>
</body>
</html>
