<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Error</title>
  <link rel="icon" type="image/png" href="assets/img/favicon_oscuro.png">
  <meta name="robots" content="noindex, nofollow">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      cursor: none;
    }

    #jumpscare-video {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>

  <!-- 1. Empezamos con el atributo muted en el HTML -->
  <video id="jumpscare-video" src="assets/video/Original mp4.xawL3WXj.mp4.part" autoplay muted loop playsinline></video>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('jumpscare-video');

      // 2. Arrancamos el vídeo (Chrome nos da la luz verde por estar muteado)
      const playPromise = video.play();

      if (playPromise !== undefined) {
        playPromise.then(() => {
          // 3. El vídeo ya está reproduciéndose. Intentamos quitarle el mute.
          // Añadimos un mínimo retardo para que el navegador procese que ya está en play.
          setTimeout(() => {
            video.muted = false;
            video.volume = 1.0;
          }, 100);
        }).catch(error => {
          console.log("El navegador bloqueó incluso el autoplay en silencio.");
        });
      }
    });
  </script>
</body>
</html>
