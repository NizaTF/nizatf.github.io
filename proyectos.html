<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Proyectos · Nico Talens</title>
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      if (savedTheme === 'light' || (!savedTheme && systemPrefersLight)) {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  
  <link rel="icon" type="image/png" href="assets/img/favicon_oscuro.png" id="dynamic-favicon">
</head>

<body>
  <div id="scroll-progress"></div>

  <nav class="navbar">
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="sobre-mi.html">Sobre mí</a>
      <a href="proyectos.html" class="active">Proyectos</a>
      <a href="habilidades.html">Habilidades</a>
      <a href="contacto.html">Contacto</a>
    </div>
    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">☀️</button>
  </nav>

  <section class="page-header">
    <span class="eyebrow">01 // proyectos</span>
    <h1 class="page-title">Mis <span class="accent">proyectos</span></h1>
    <p class="page-subtitle">
      Una selección de trabajos reales y personales. Cada tarjeta abre la web del proyecto.
    </p>
  </section>

  <section class="section">
    <!-- Aquí se inyectarán las tarjetas -->
    <div class="projects-grid" id="projects-grid">
      <p style="color: var(--text-muted); font-family: var(--font-mono);">Cargando proyectos...</p>
    </div>
  </section>

  <footer class="footer">
    <p>© 2026 · Nico Talens · Hecho con HTML &amp; CSS</p>
  </footer>
  
  <button id="back-to-top" aria-label="Volver arriba">↑</button>
  <script src="ui.js"></script>

  <!-- SCRIPT PARA GENERAR LAS TARJETAS -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("projects-grid");

      // Mapeo de estados a clases y textos
      const statusMap = {
        active: { class: 'is-active', text: 'activo' },
        building: { class: 'is-building', text: 'en proceso' },
        planned: { class: 'is-planned', text: 'planeado' },
        inactive: { class: 'is-inactive', text: 'inactivo' }
      };

      // Leemos el archivo JSON
      // Usamos un timestamp para evitar la caché del navegador y ver los cambios al instante
      fetch(`projects.json?v=${new Date().getTime()}`)
        .then(res => {
          if (!res.ok) throw new Error('Error al cargar los proyectos');
          return res.json();
        })
        .then(projects => {
          grid.innerHTML = ''; // Limpiamos el mensaje de carga

          if (projects.length === 0) {
            grid.innerHTML = '<p style="color: var(--text-muted);">No hay proyectos aún.</p>';
            return;
          }

          projects.forEach(p => {
            const st = statusMap[p.status] || statusMap.inactive;

            // Generar barritas de nivel
            let dots = '';
            for (let i = 1; i <= 5; i++) {
              dots += `<span class="lvl-dot ${i <= p.level ? 'is-on' : ''}"></span>`;
            }

            // Crear la tarjeta HTML
            const card = `
              <a class="project-card" href="${p.link}" target="_blank" rel="noopener">
                <div class="project-thumb">
                  <img src="${p.image}" alt="Vista previa de ${p.title}" class="project-img" onerror="this.src='assets/img/placeholder.webp'">
                </div>
                <div class="project-body">
                  <div class="project-badges">
                    <span class="badge ${st.class}">
                      <span class="badge-dot"></span>
                      ${st.text}
                    </span>
                    <div class="badge-level" title="Nivel de seriedad: ${p.level}/5">
                      <span class="badge-label">nivel</span>
                      ${dots}
                    </div>
                  </div>
                  <div class="project-top">
                    <h2 class="project-title">${p.title}</h2>
                    <span class="project-arrow" aria-hidden="true">↗</span>
                  </div>
                  <p class="project-desc">${p.desc}</p>
                </div>
              </a>
            `;
            grid.innerHTML += card;
          });
        })
        .catch(err => {
          grid.innerHTML = `<p style="color: var(--accent);">Error al cargar el JSON: ${err.message}</p>`;
        });
    });
  </script>
</body>
</html>
