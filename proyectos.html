<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Proyectos · Nico Talens</title>
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      if (savedTheme === 'light' || (!savedTheme && systemPrefersLight)) {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  
  <link rel="icon" type="image/png" href="assets/img/favicon_oscuro.png" id="dynamic-favicon">
  
  <style>
    /* Estilos exclusivos del carrusel público */
    .project-carousel {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }

    .project-carousel img {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0; transition: opacity 0.4s ease; object-position: center;
    }

    .project-carousel img.active { opacity: 1; z-index: 2; }

    /* Controles del carrusel */
    .carousel-nav {
      position: absolute;
      top: 50%; transform: translateY(-50%);
      width: 100%; display: flex; justify-content: space-between;
      padding: 0 10px; z-index: 10; pointer-events: none;
      opacity: 0; transition: opacity 0.3s ease;
    }

    .project-card:hover .carousel-nav { opacity: 1; }

    .carousel-nav button {
      pointer-events: auto;
      background: rgba(10, 14, 23, 0.7); color: #fff; border: 1px solid var(--border-strong);
      border-radius: 50%; width: 32px; height: 32px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; backdrop-filter: blur(4px); transition: all 0.2s ease;
    }

    .carousel-nav button:hover { background: var(--accent); border-color: var(--accent); }

    /* Puntitos indicadores */
    .carousel-dots {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; z-index: 10;
    }

    .carousel-dots span {
      width: 8px; height: 8px; border-radius: 50%;
      background: rgba(255,255,255,0.3); transition: all 0.3s ease;
      cursor: pointer;
    }

    .carousel-dots span.active {
      background: #fff; transform: scale(1.3);
    }

    .carousel-dots span:hover { background: rgba(255,255,255,0.7); }
  </style>
</head>

<body>
  <div id="scroll-progress"></div>

  <nav class="navbar">
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="sobre-mi.html">Sobre mí</a>
      <a href="proyectos.html" class="active">Proyectos</a>
      <a href="habilidades.html">Habilidades</a>
      <a href="contacto.html">Contacto</a>
    </div>
    <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema">☀️</button>
  </nav>

  <section class="page-header">
    <span class="eyebrow">01 // proyectos</span>
    <h1 class="page-title">Mis <span class="accent">proyectos</span></h1>
    <p class="page-subtitle">Una selección de trabajos reales y personales.</p>
  </section>

  <section class="section">
    <div class="projects-grid" id="projects-grid">
      <p style="color: var(--text-muted); font-family: var(--font-mono);">Cargando proyectos...</p>
    </div>
  </section>

  <footer class="footer">
    <p>© 2026 · Nico Talens · Hecho con HTML &amp; CSS</p>
  </footer>
  
  <button id="back-to-top" aria-label="Volver arriba">↑</button>
  <script src="ui.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const grid = document.getElementById("projects-grid");

      const statusMap = {
        active: { class: 'is-active', text: 'activo' },
        building: { class: 'is-building', text: 'en proceso' },
        planned: { class: 'is-planned', text: 'planeado' },
        inactive: { class: 'is-inactive', text: 'inactivo' }
      };

      fetch(`projects.json?v=${new Date().getTime()}`)
        .then(res => res.json())
        .then(projects => {
          grid.innerHTML = '';
          if (projects.length === 0) {
            grid.innerHTML = '<p style="color: var(--text-muted);">No hay proyectos aún.</p>';
            return;
          }

          projects.forEach((p, index) => {
            const st = statusMap[p.status] || statusMap.inactive;
            let dotsLvl = '';
            for (let i = 1; i <= 5; i++) dotsLvl += `<span class="lvl-dot ${i <= p.level ? 'is-on' : ''}"></span>`;

            let imagesHTML = '';
            let navHTML = '';
            let dotsHTML = '';
            
            let projectImages = p.images || (p.image ? [p.image] : []);
            const fitMode = p.imageFit || 'cover';

            if (projectImages.length > 0) {
              projectImages.forEach((imgUrl, i) => {
                imagesHTML += `<img src="${imgUrl}" alt="${p.title}" style="object-fit: ${fitMode};" class="${i === 0 ? 'active' : ''}">`;
              });
              
              if (projectImages.length > 1) {
                navHTML = `
                  <div class="carousel-nav">
                    <button onclick="event.preventDefault(); moveSlide(${index}, -1, this)">❮</button>
                    <button onclick="event.preventDefault(); moveSlide(${index}, 1, this)">❯</button>
                  </div>
                `;
                dotsHTML = `<div class="carousel-dots">`;
                projectImages.forEach((_, i) => {
                  dotsHTML += `<span class="${i === 0 ? 'active' : ''}" onclick="event.preventDefault(); jumpToSlide(${index}, ${i}, this)"></span>`;
                });
                dotsHTML += `</div>`;
              }
            }

            const card = `
              <a class="project-card" href="${p.link}" target="_blank" rel="noopener" id="proj-card-${index}">
                <div class="project-thumb project-carousel" data-current="0">
                  ${imagesHTML || '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-family:var(--font-mono);">Sin imágenes</div>'}
                  ${navHTML}
                  ${dotsHTML}
                </div>
                <div class="project-body">
                  <div class="project-badges">
                    <span class="badge ${st.class}"><span class="badge-dot"></span>${st.text}</span>
                    <div class="badge-level" title="Nivel: ${p.level}/5"><span class="badge-label">nivel</span>${dotsLvl}</div>
                  </div>
                  <div class="project-top">
                    <h2 class="project-title">${p.title}</h2>
                    <span class="project-arrow" aria-hidden="true">↗</span>
                  </div>
                  <p class="project-desc">${p.desc}</p>
                </div>
              </a>
            `;
            grid.innerHTML += card;
          });

          startCarousels();
        })
        .catch(err => { grid.innerHTML = `<p style="color: var(--accent);">Error al cargar los proyectos.</p>`; });
    });

    function updateCarouselUI(carousel, newIndex) {
      const images = carousel.querySelectorAll('img');
      const dots = carousel.querySelectorAll('.carousel-dots span');
      images.forEach((img, i) => img.classList.toggle('active', i === newIndex));
      dots.forEach((dot, i) => dot.classList.toggle('active', i === newIndex));
      carousel.dataset.current = newIndex;
    }

    function moveSlide(projectIndex, direction, btnElement) {
      event.stopPropagation(); 
      const carousel = btnElement.closest('.project-carousel');
      const images = carousel.querySelectorAll('img');
      if (images.length <= 1) return;
      let current = parseInt(carousel.dataset.current);
      current = (current + direction + images.length) % images.length;
      updateCarouselUI(carousel, current);
    }

    function jumpToSlide(projectIndex, targetIndex, dotElement) {
      event.stopPropagation();
      const carousel = dotElement.closest('.project-carousel');
      updateCarouselUI(carousel, targetIndex);
    }

        function startCarousels() {
      setInterval(() => {
        document.querySelectorAll('.project-carousel').forEach(carousel => {
          const images = carousel.querySelectorAll('img');
          if (images.length <= 1) return;
          
          // 👇 AQUÍ ESTÁ EL CAMBIO: Solo pausa si el ratón está sobre el contenedor de la imagen
          if (carousel.matches(':hover')) return; 
          
          let current = parseInt(carousel.dataset.current);
          current = (current + 1) % images.length;
          updateCarouselUI(carousel, current);
        });
      }, 3500); 
    }
  </script>
</body>
</html>
