<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Admin · Panel de Control</title>
  
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme');
      const systemPrefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
      if (savedTheme === 'light' || (!savedTheme && systemPrefersLight)) {
        document.documentElement.setAttribute('data-theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  
  <link rel="icon" type="image/png" href="assets/img/favicon_oscuro.png" id="dynamic-favicon">
  
  <style>
    /* ============================
       LAYOUT APP (SIN SCROLL GLOBAL)
       ============================ */
    body { margin: 0; padding: 0; overflow: hidden; height: 100vh; background: var(--bg); color: var(--text); font-family: var(--font-sans); }
    
    /* Botón de tema flotante */
    .theme-toggle { position: fixed; top: 22px; right: 20px; z-index: 1000; background: var(--surface); border: 1px solid var(--border); border-radius: 50%; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-md); }
    .theme-icon-img { width: 24px; height: 24px; object-fit: contain; }

    #admin-app { display: none; height: 100vh; width: 100vw; }
    #pin-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }

    /* ============================
       ESTRUCTURA DASHBOARD
       ============================ */
    .dashboard-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      height: 100vh;
    }

    /* Barra Lateral (Lista de proyectos) */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .sidebar-header h2 { font-size: 16px; margin: 0; color: var(--text); }
    .project-list-scroll { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    
    .project-item { padding: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-md); cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
    .project-item:hover { border-color: var(--accent); background: var(--bg); }
    .project-item.active { border-color: var(--accent); background: var(--accent-soft); }
    .project-item h3 { margin: 0; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
    .project-item .del-btn { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 16px; padding: 0; }

    /* Área Principal (Editor) */
    .main-editor {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .editor-header { 
      padding: 5px 25px; 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: var(--surface); 
      padding-right: 80px; /* 👈 Deja hueco para el botón de claro/oscuro */
    }
    .editor-header h1 { font-size: 1px; margin: 0; }
    .header-actions { display: flex; gap: 10px; }

    .editor-body {
      display: grid;
      grid-template-columns: 1fr 400px;
      flex: 1;
      overflow: hidden;
    }

    /* Formulario (Scrollable) */
    .form-scroll {
      padding: 25px;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }

    /* Preview (Fijo) */
    .preview-area {
      padding: 25px;
      overflow-y: auto;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* ============================
       COMPONENTES DEL FORMULARIO
       ============================ */
    .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
    .form-field label { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
    .form-field input, .form-field textarea, .form-field select { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-md); padding: 10px; font-family: var(--font-sans); font-size: 14px; color: var(--text); box-sizing: border-box; outline: none; }
    .form-field input:focus, .form-field textarea:focus { border-color: var(--accent); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    
    /* Imágenes */
    .image-manager-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 200px; overflow-y: auto; }
    .image-item { display: flex; align-items: center; gap: 10px; background: var(--surface-2); padding: 8px; border-radius: var(--r-sm); border: 1px solid var(--border); cursor: grab; }
    .image-item.sortable-ghost { opacity: 0.4; border-style: dashed; border-color: var(--accent); }
    .image-item img { width: 40px; height: 30px; object-fit: cover; border-radius: 4px; pointer-events: none; }
    .image-item-info { flex: 1; font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    .image-item .del-btn { background: var(--accent); color: #fff; border: none; border-radius: 4px; cursor: pointer; padding: 4px 8px; }

    /* Markdown Preview */
    .md-preview-box { display: none; background: var(--bg); border: 1px dashed var(--border-strong); border-radius: var(--r-md); padding: 15px; margin-top: 10px; font-size: 13px; color: var(--text-soft); line-height: 1.6; max-height: 200px; overflow-y: auto; }
    .md-preview-box h1, .md-preview-box h2, .md-preview-box h3 { color: var(--text); margin-top: 10px; margin-bottom: 5px; }
    .md-preview-box strong { color: var(--accent); }
    .preview-toggle { background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-size: 11px; padding: 4px 8px; border-radius: 4px; cursor: pointer; margin-top: 5px; }
    .preview-toggle:hover { color: var(--accent); border-color: var(--accent); }

    /* ============================
       PREVIEW DEL PROYECTO
       ============================ */
    .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
    .preview-carousel { position: relative; width: 100%; aspect-ratio: 16 / 10; background: var(--surface-2); }
    .preview-carousel img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s; object-fit: cover; }
    .preview-carousel img.active { opacity: 1; z-index: 2; }
    .project-body { padding: 20px; }
    .project-badges { display: flex; gap: 10px; margin-bottom: 10px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; border: 1px solid transparent; }
    .badge.is-active { color: var(--green); background: rgba(61, 220, 151, 0.1); border-color: rgba(61, 220, 151, 0.3); }
    .badge.is-building { color: var(--accent); background: var(--accent-soft); border-color: var(--border-accent); }
    .badge.is-planned { color: #6aa8ff; background: rgba(106, 168, 255, 0.1); border-color: rgba(106, 168, 255, 0.3); }
    .badge.is-inactive { color: var(--text-dim); background: var(--surface-2); border-color: var(--border); }
    .badge-level { display: flex; gap: 3px; align-items: center; }
    .lvl-dot { width: 5px; height: 10px; background: var(--border-strong); border-radius: 1px; }
    .lvl-dot.is-on { background: var(--accent); }
    .project-title { font-size: 18px; margin: 0 0 10px 0; color: var(--text); }
    .project-desc { font-size: 13px; color: var(--text-muted); margin: 0; line-height: 1.5; }

    /* ============================
       OVERLAYS (PIN Y CONFIG)
       ============================ */
    .overlay-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
    .box { background: var(--surface); padding: 30px; border-radius: var(--r-lg); border: 1px solid var(--border); max-width: 400px; width: 100%; text-align: center; box-shadow: var(--shadow-md); }
    .box h2 { color: var(--accent); margin-top: 0; }
    .box p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
    .pin-input { width: 100%; padding: 15px; font-size: 24px; text-align: center; letter-spacing: 5px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: var(--r-md); outline: none; margin-bottom: 15px; font-family: var(--font-mono); box-sizing: border-box; }
    .status-msg { font-size: 12px; font-family: var(--font-mono); color: var(--accent); margin-top: 10px; }

    /* Scrollbars finos */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    @media (max-width: 900px) {
      .dashboard-layout { grid-template-columns: 1fr; }
      .sidebar { display: none; } 
      .editor-body { grid-template-columns: 1fr; }
      .preview-area { display: none; } 
      .editor-header { padding-right: 80px; flex-direction: column; align-items: flex-start; gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- BOTÓN DE TEMA FLOTANTE -->
  <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema"></button>

  <!-- 1. PANTALLA DE PIN -->
  <div id="pin-screen" class="overlay-screen">
    <div class="box">
      <h2>[ SISTEMA BLOQUEADO ]</h2>
      <p>Introduce el PIN de administrador.</p>
      <input type="password" id="admin-pin" class="pin-input" maxlength="16" placeholder="••••••••••••••••••" autocomplete="off">
      <button class="btn btn-primary" style="width: 100%;" onclick="checkPin()">Desbloquear</button>
      <p id="pin-error" style="display: none;">PIN incorrecto.</p>
    </div>
  </div>

  <!-- 2. PANTALLA DE CONFIGURACIÓN -->
  <div id="config-screen" class="overlay-screen" style="display: none;">
    <div class="box">
      <h2>🔧 Configuración Inicial</h2>
      <p>Conecta tu panel con GitHub para cargar los proyectos.</p>
      <div class="form-field" style="text-align: left;">
        <label>Usuario</label>
        <input type="text" id="gh-user" placeholder="Ej: NizaTF">
      </div>
      <div class="form-field" style="text-align: left;">
        <label>Repositorio</label>
        <input type="text" id="gh-repo" placeholder="Ej: nizatf.github.io">
      </div>
      <div class="form-field" style="text-align: left;">
        <label>Token (Fine-grained)</label>
        <input type="password" id="gh-token" placeholder="github_pat_...">
      </div>
      <button class="btn btn-primary" style="width: 100%; margin-top: 10px;" onclick="saveConfig()">Conectar y Entrar</button>
    </div>
  </div>

  <!-- 3. APLICACIÓN PRINCIPAL -->
  <div id="admin-app">
    <div class="dashboard-layout">
      
      <!-- BARRA LATERAL: LISTA -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>📦 Proyectos</h2>
          <button class="btn btn-primary" style="padding: 5px 10px; font-size: 12px;" onclick="resetForm()">+ Nuevo</button>
        </div>
        <div class="project-list-scroll" id="projects-list">
          <!-- Se llena con JS -->
        </div>
      </aside>

      <!-- ÁREA PRINCIPAL: EDITOR -->
      <main class="main-editor">
        <header class="editor-header">
          <h1 id="editor-title">Editando Proyecto</h1>
          
          <div class="header-actions">
            <!-- Input oculto para importar archivo -->
            <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importJSON(event)">
            
            <button class="btn btn-secondary" style="padding: 8px 12px; font-size: 12px;" onclick="exportJSON()">📥 Backup</button>
            <button class="btn btn-secondary" style="padding: 8px 12px; font-size: 12px;" onclick="document.getElementById('import-file').click()">📤 Importar</button>
            <button class="btn btn-primary" style="padding: 8px 16px; font-size: 13px;" onclick="saveProject()" id="save-btn">💾 Guardar</button>
          </div>
        </header>

        <div class="editor-body">
          
          <!-- COLUMNA IZQUIERDA: FORMULARIO -->
          <div class="form-scroll">
            <input type="hidden" id="proj-id">
            
            <div class="form-row">
              <div class="form-field">
                <label>Título del Proyecto</label>
                <input type="text" id="proj-title" placeholder="Nombre..." oninput="updatePreview()">
              </div>
              <div class="form-field">
                <label>Enlace del Proyecto</label>
                <input type="url" id="proj-link" placeholder="https://...">
              </div>
            </div>

            <div class="form-field">
              <label>Descripción corta (aparece en la tarjeta)</label>
              <textarea id="proj-desc" rows="2" placeholder="Resumen..." oninput="updatePreview()"></textarea>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label>Estado</label>
                <select id="proj-status" onchange="updatePreview()">
                  <option value="active">Activo</option>
                  <option value="building">En proceso</option>
                  <option value="planned">Planeado</option>
                  <option value="inactive">Inactivo</option>
                </select>
              </div>
              <div class="form-field">
                <label>Nivel de Seriedad (1-5)</label>
                <input type="number" id="proj-level" min="1" max="5" value="5" oninput="updatePreview()">
              </div>
            </div>

            <div class="form-row">
              <div class="form-field">
                <label>Ajuste de la imagen</label>
                <select id="proj-fit" onchange="updatePreview()">
                  <option value="cover">Cover (Rellenar)</option>
                  <option value="contain">Contain (Entera)</option>
                </select>
              </div>
              <div class="form-field">
                <label>Habilidades (separadas por comas)</label>
                <input type="text" id="proj-skills" list="skills-list" placeholder="HTML, CSS...">
                <datalist id="skills-list"></datalist>
              </div>
            </div>

            <div class="form-field">
              <label>Contenido del Blog (Markdown)</label>
              <textarea id="proj-blog" rows="6" placeholder="Historia del proyecto..." oninput="updateMdPreview()"></textarea>
              <button type="button" class="preview-toggle" onclick="toggleMdPreview()">👁️ Ver Formato Markdown</button>
              <div class="md-preview-box" id="md-preview-box"></div>
            </div>

            <div class="form-field">
              <label>Fotografías (Arrastra para reordenar)</label>
              <input type="file" id="proj-images-file" accept="image/*" multiple onchange="handleFilesSelect(event)">
              <div class="image-manager-list" id="image-manager-list"></div>
            </div>
            
            <div class="status-msg" id="status-msg"></div>
          </div>

          <!-- COLUMNA DERECHA: PREVIEW -->
          <div class="preview-area">
            <h3 style="margin-top: 0; font-size: 14px; color: var(--text-muted); text-transform: uppercase;">Previsualización</h3>
            <div class="project-card">
              <div class="preview-carousel" id="preview-carousel">
                <div id="prev-img-placeholder" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-family: var(--font-mono); font-size: 12px;">Sin imágenes</div>
              </div>
              <div class="project-body">
                <div class="project-badges">
                  <span class="badge is-active" id="prev-badge"><span class="badge-dot"></span><span id="prev-badge-text">activo</span></span>
                  <div class="badge-level" id="prev-level-box">
                    <span class="lvl-dot is-on"></span><span class="lvl-dot is-on"></span><span class="lvl-dot is-on"></span><span class="lvl-dot is-on"></span><span class="lvl-dot is-on"></span>
                  </div>
                </div>
                <h2 class="project-title" id="prev-title">Título del proyecto</h2>
                <p class="project-desc" id="prev-desc">Aquí aparecerá la descripción...</p>
              </div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script>
    const ADMIN_PIN = "110308"; 
    let projectsData = [];
    let fileSha = null;
    let currentImages = []; 
    let previewIndex = 0;

    function checkPin() {
      const input = document.getElementById('admin-pin').value;
      if (input === ADMIN_PIN) {
        document.getElementById('pin-screen').style.display = 'none';
        if (!localStorage.getItem('gh_token')) {
          document.getElementById('config-screen').style.display = 'flex';
        } else {
          startApp();
        }
      } else {
        document.getElementById('pin-error').style.display = 'block';
        document.getElementById('admin-pin').value = '';
      }
    }

    document.getElementById('admin-pin').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPin();
    });

    function saveConfig() {
      const user = document.getElementById('gh-user').value.trim();
      const repo = document.getElementById('gh-repo').value.trim();
      const token = document.getElementById('gh-token').value.trim();
      if (!user || !repo || !token) return alert('Rellena todos los campos.');
      localStorage.setItem('gh_user', user); localStorage.setItem('gh_repo', repo); localStorage.setItem('gh_token', token);
      document.getElementById('config-screen').style.display = 'none';
      startApp();
    }

    function startApp() {
      document.getElementById('admin-app').style.display = 'block';
      fetchProjects();
    }

    const API_URL = () => {
      const user = localStorage.getItem('gh_user');
      const repo = localStorage.getItem('gh_repo');
      return `https://api.github.com/repos/${user}/${repo}/contents/projects.json`;
    };

    async function fetchProjects() {
      const token = localStorage.getItem('gh_token');
      try {
        showStatus('Cargando proyectos...', 'ok');
        const res = await fetch(API_URL(), { headers: { 'Authorization': `token ${token}` } });
        if (!res.ok) throw new Error('Error al conectar.');
        const data = await res.json();
        fileSha = data.sha;
        projectsData = JSON.parse(decodeURIComponent(escape(atob(data.content))));
        
        generateSkillsDatalist();
        renderList();
        if(projectsData.length > 0) editProject(0); else resetForm();
        showStatus('Proyectos cargados.', 'ok');
      } catch (err) { showStatus(err.message, 'err'); }
    }

    function renderList() {
      const list = document.getElementById('projects-list');
      list.innerHTML = '';
      projectsData.forEach((p, index) => {
        const item = document.createElement('div');
        item.className = 'project-item';
        item.onclick = () => {
          document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
          editProject(index);
        };
        item.innerHTML = `
          <h3>${p.title}</h3>
          <button class="del-btn" onclick="event.stopPropagation(); deleteProject(${index})">×</button>
        `;
        list.appendChild(item);
      });
    }

    function editProject(index) {
      const p = projectsData[index];
      document.getElementById('editor-title').textContent = 'Editando: ' + p.title;
      document.getElementById('proj-id').value = index;
      document.getElementById('proj-title').value = p.title;
      document.getElementById('proj-desc').value = p.desc;
      document.getElementById('proj-link').value = p.link || '';
      document.getElementById('proj-status').value = p.status;
      document.getElementById('proj-level').value = p.level;
      document.getElementById('proj-fit').value = p.imageFit || 'cover';
      document.getElementById('proj-skills').value = p.skills ? p.skills.join(', ') : '';
      document.getElementById('proj-blog').value = p.blog || '';
      document.getElementById('md-preview-box').style.display = 'none';
      
      currentImages = [];
      if (p.images && Array.isArray(p.images)) {
        currentImages = p.images.map(url => ({ id: Date.now()+Math.random(), url, file: null, isNew: false }));
      }
      previewIndex = 0;
      document.getElementById('proj-images-file').value = '';
      renderImageManager();
    }

    function resetForm() {
      document.querySelectorAll('.project-item').forEach(el => el.classList.remove('active'));
      document.getElementById('editor-title').textContent = 'Nuevo Proyecto';
      document.getElementById('proj-id').value = '';
      document.getElementById('proj-title').value = '';
      document.getElementById('proj-desc').value = '';
      document.getElementById('proj-link').value = '';
      document.getElementById('proj-status').value = 'active';
      document.getElementById('proj-level').value = '5';
      document.getElementById('proj-fit').value = 'cover';
      document.getElementById('proj-skills').value = ''; 
      document.getElementById('proj-blog').value = '';
      document.getElementById('md-preview-box').style.display = 'none';
      
      currentImages.forEach(img => { if(img.isNew) URL.revokeObjectURL(img.url) });
      currentImages = [];
      previewIndex = 0;
      document.getElementById('proj-images-file').value = '';
      renderImageManager();
    }

    function handleFilesSelect(event) {
      const files = event.target.files;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const url = URL.createObjectURL(file);
        currentImages.push({ id: Date.now() + '_' + i, url: url, file: file, isNew: true });
      }
      event.target.value = ''; 
      renderImageManager();
    }

    function renderImageManager() {
      const list = document.getElementById('image-manager-list');
      list.innerHTML = '';
      if (currentImages.length === 0) {
        list.innerHTML = '<div style="font-size:11px; color:var(--text-dim);">No hay imágenes.</div>';
      }

      currentImages.forEach((imgData) => {
        const item = document.createElement('div');
        item.className = 'image-item';
        item.dataset.id = imgData.id;
        let filename = imgData.isNew ? imgData.file.name : imgData.url.split('/').pop();
        filename = filename.length > 20 ? filename.substring(0, 17) + '...' : filename;

        item.innerHTML = `
          <img src="${imgData.url}" alt="thumb">
          <div class="image-item-info">${filename} ${imgData.isNew ? '(Nueva)' : ''}</div>
          <button class="del-btn" onclick="removeImage('${imgData.id}')">×</button>
        `;
        list.appendChild(item);
      });

      if (window.Sortable) {
        new Sortable(list, {
          animation: 150, ghostClass: 'sortable-ghost',
          onEnd: function () {
            const newOrder = [];
            list.querySelectorAll('.image-item').forEach(item => {
              newOrder.push(currentImages.find(img => img.id == item.dataset.id));
            });
            currentImages = newOrder;
            updatePreview();
          }
        });
      }
      updatePreview();
    }

    function removeImage(id) {
      const index = currentImages.findIndex(img => img.id == id);
      if (index > -1) {
        if(currentImages[index].isNew) URL.revokeObjectURL(currentImages[index].url);
        currentImages.splice(index, 1);
        if (previewIndex >= currentImages.length) previewIndex = Math.max(0, currentImages.length - 1);
        renderImageManager();
      }
    }

    function updatePreview() {
      const title = document.getElementById('proj-title').value || 'Título';
      const desc = document.getElementById('proj-desc').value || 'Descripción...';
      const status = document.getElementById('proj-status').value;
      const level = parseInt(document.getElementById('proj-level').value) || 1;
      const fit = document.getElementById('proj-fit').value;

      document.getElementById('prev-title').textContent = title;
      document.getElementById('prev-desc').textContent = desc;

      const badge = document.getElementById('prev-badge');
      badge.className = 'badge';
      const statusMap = { active: 'is-active', building: 'is-building', planned: 'is-planned', inactive: 'is-inactive' };
      badge.classList.add(statusMap[status]);
      document.getElementById('prev-badge-text').textContent = status;

      document.querySelectorAll('#prev-level-box .lvl-dot').forEach((dot, i) => {
        dot.classList.toggle('is-on', i < level);
      });

      const carousel = document.getElementById('preview-carousel');
      carousel.querySelectorAll('img').forEach(el => el.remove());
      const placeholder = document.getElementById('prev-img-placeholder');

      if (currentImages.length > 0) {
        placeholder.style.display = 'none';
        currentImages.forEach((imgData, index) => {
          const img = document.createElement('img');
          img.src = imgData.url;
          img.style.objectFit = fit;
          img.className = index === previewIndex ? 'active' : '';
          carousel.appendChild(img);
        });
      } else {
        placeholder.style.display = 'flex';
      }
    }

    function toggleMdPreview() {
      const box = document.getElementById('md-preview-box');
      box.style.display = box.style.display === 'block' ? 'none' : 'block';
      updateMdPreview();
    }

    function updateMdPreview() {
      const box = document.getElementById('md-preview-box');
      if (box.style.display === 'block') {
        box.innerHTML = marked.parse(document.getElementById('proj-blog').value);
      }
    }

    function generateSkillsDatalist() {
      const allSkills = new Set();
      projectsData.forEach(p => { if (p.skills) p.skills.forEach(s => allSkills.add(s)); });
      const datalist = document.getElementById('skills-list');
      datalist.innerHTML = '';
      allSkills.forEach(skill => {
        const option = document.createElement('option');
        option.value = skill;
        datalist.appendChild(option);
      });
    }

    async function saveProject() {
      const id = document.getElementById('proj-id').value;
      const title = document.getElementById('proj-title').value;
      const desc = document.getElementById('proj-desc').value;
      
      if (!title || !desc) return showStatus('Título y descripción son obligatorios.', 'err');
      if (currentImages.length === 0) return showStatus('Sube al menos una imagen.', 'err');

      const saveBtn = document.getElementById('save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Guardando...';

      try {
        let finalImageUrls = [];
        for (let i = 0; i < currentImages.length; i++) {
          const imgData = currentImages[i];
          if (imgData.isNew && imgData.file) {
            saveBtn.textContent = `Subiendo img (${i+1}/${currentImages.length})...`;
            finalImageUrls.push(await uploadImageToGitHub(imgData.file));
          } else {
            finalImageUrls.push(imgData.url);
          }
        }

        const project = { 
          id: id ? projectsData[id].id : Date.now().toString(), 
          title, desc, 
          link: document.getElementById('proj-link').value, 
          blog: document.getElementById('proj-blog').value,
          images: finalImageUrls, 
          imageFit: document.getElementById('proj-fit').value, 
          status: document.getElementById('proj-status').value, 
          level: parseInt(document.getElementById('proj-level').value),
          skills: document.getElementById('proj-skills').value.split(',').map(s => s.trim()).filter(s => s !== "")
        };
        
        if (id) projectsData[id] = project; else projectsData.push(project);

        await saveToGitHub();
        showStatus('¡Guardado con éxito!', 'ok');
        generateSkillsDatalist();
        renderList();
        
      } catch (err) {
        showStatus(err.message, 'err');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 Guardar';
      }
    }

    async function deleteProject(index) {
      if (!confirm('¿Seguro que quieres borrar este proyecto?')) return;
      projectsData.splice(index, 1);
      await saveToGitHub();
      renderList();
      resetForm();
    }

    async function saveToGitHub() {
      const token = localStorage.getItem('gh_token');
      const contentBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(projectsData, null, 2))));
      const res = await fetch(API_URL(), {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: 'Actualizar proyectos', content: contentBase64, sha: fileSha })
      });
      if (!res.ok) throw new Error('Error al guardar en GitHub.');
      const data = await res.json();
      fileSha = data.content.sha;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    async function uploadImageToGitHub(file) {
      const token = localStorage.getItem('gh_token'), user = localStorage.getItem('gh_user'), repo = localStorage.getItem('gh_repo');
      const filename = Date.now() + '_' + file.name.replace(/[^a-zA-Z0-9.\-_]/g, '');
      const path = `assets/img/projects/${filename}`;
      const base64Data = await fileToBase64(file);
      const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${path}`, {
        method: 'PUT',
        headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: `Subir img: ${filename}`, content: base64Data.split(',')[1] })
      });
      if (!res.ok) throw new Error('Error al subir imagen.');
      return path;
    }

    function showStatus(msg, type) {
      const el = document.getElementById('status-msg');
      el.textContent = msg;
      el.style.color = type === 'err' ? 'var(--accent)' : 'var(--green)';
    }

    function exportJSON() {
      if (projectsData.length === 0) return alert("No hay datos.");
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projectsData, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `backup_proyectos.json`);
      a.click();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const importedData = JSON.parse(e.target.result);
          if (Array.isArray(importedData)) {
            if(confirm("⚠️ Esto reemplazará TODOS tus proyectos actuales en GitHub. ¿Estás seguro?")) {
              projectsData = importedData;
              await saveToGitHub();
              generateSkillsDatalist();
              renderList();
              if(projectsData.length > 0) editProject(0); else resetForm();
              showStatus("Copia importada y guardada con éxito.", "ok");
            }
          } else {
            alert("El archivo no tiene el formato correcto (debe ser una lista de proyectos).");
          }
        } catch (err) {
          alert("Error al leer el archivo JSON.");
        }
      };
      reader.readAsText(file);
      event.target.value = ''; 
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('admin_logged') === 'true') {
        document.getElementById('pin-screen').style.display = 'none';
        if (!localStorage.getItem('gh_token')) {
          document.getElementById('config-screen').style.display = 'flex';
        } else {
          startApp();
        }
      }
    });
  </script>
  <script src="ui.js"></script>
</body>
</html>
