<!DOCTYPE html>
<html>
<head>
  <title>Administrator Login</title>
  <style>
    /* Un diseño moderno tipo SaaS o panel de control */
    body { background: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { text-align: center; color: #1f2937; margin-bottom: 20px; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    
    /* Overlay de carga */
    .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; justify-content: center; align-items: center; flex-direction: column; font-family: monospace; font-size: 18px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Sign in to Dashboard</h2>
    <form onsubmit="doLogin(event)">
      <input type="text" placeholder="admin@portfolio.com" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Sign In</button>
    </form>
  </div>

  <div class="overlay" id="overlay">
    <p id="status">Authenticating...</p>
    <p id="substatus" style="color:#3ddc97; font-size:14px; margin-top:10px;"></p>
  </div>

  <script>
    function doLogin(e) {
      e.preventDefault();
      document.getElementById('overlay').style.display = 'flex';
      
      // Simulamos el proceso de login
      setTimeout(() => {
        document.getElementById('status').textContent = "Login successful. Loading admin panel...";
        document.getElementById('substatus').textContent = "Fetching user data...";
      }, 1500);

      // El golpe
      setTimeout(() => {
        window.location.href = "../secret.html";
      }, 3000);
    }
  </script>
</body>
</html>
